---
# OATS is an acceptance testing framework for OpenTelemetry
# https://github.com/grafana/oats/tree/main/yaml
docker-compose:
  files:
    - ./docker-compose.oats.yml
input:
  # status defaults to 200; any other response fails the poll until timeout.
  - path: /demo/trace
  - path: /demo/trace?fail=true
    status: "500"
  - path: /demo/validation
    status: "400"
  - path: /demo/panic
    status: "500"
  - path: /no-such-route
    status: "404"
expected:
  traces:
    - traceql: '{ span.http.route = "/demo/trace" && kind = server }'
      spans:
        - name: "GET /demo/trace"
          attributes:
            service.name: basement
        - name: "demo.work"
          attributes:
            service.name: basement

    # 4xx leaves the SERVER span status unset (semconv).
    - traceql: '{ kind = server && status != error && span.problem.type = "https://problems.valri11.dev/validation-error" && span.problem.status = 400 }'
      spans:
        - name: "GET /demo/validation"
          attributes:
            service.name: basement

    - traceql: '{ kind = server && status = error && span.problem.type = "https://problems.valri11.dev/panic" && span.http.response.status_code = 500 }'
      spans:
        - name: "GET /demo/panic"
          attributes:
            service.name: basement

    - traceql: '{ kind = server && span.http.route = "/" && span.problem.type = "about:blank" && span.problem.status = 404 }'
      spans:
        - name: "GET /"
          attributes:
            service.name: basement

  metrics:
    - promql: 'http_server_request_duration_seconds_count{service_name="basement",http_route="/demo/trace"}'
      value: "> 0"

    - promql: 'servicepack_http_server_problems_total{service_name="basement",problem_type="https://problems.valri11.dev/validation-error",http_response_status_code="400"}'
      value: "> 0"

    - promql: 'servicepack_http_server_problems_total{service_name="basement",problem_type="https://problems.valri11.dev/panic",http_response_status_code="500"}'
      value: "> 0"

    - promql: 'servicepack_http_server_problems_total{service_name="basement",problem_type="about:blank",http_route="/",http_response_status_code="404"}'
      value: "> 0"

    - promql: 'basement_demo_work_items_total{service_name="basement",basement_demo_work_result="ok"}'
      value: "> 0"

    - promql: 'basement_demo_work_duration_seconds_count{service_name="basement",basement_demo_work_result="error"}'
      value: "> 0"

  logs:
    - logql: '{service_name="basement"} |= "demo work done"'
      contains:
        - "demo work done"
