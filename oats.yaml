---
# OATS is an acceptance testing framework for OpenTelemetry
# https://github.com/grafana/oats/tree/main/yaml
docker-compose:
  files:
    - ./docker-compose.oats.yml
input:
  - path: /livez
  - path: /demo/validation
  - path: /demo/panic
  - path: /no-such-route
expected:
  traces:
    # http.target was removed in current OTEL semconv; otelhttp emits http.route.
    - traceql: '{ span.http.route = "/livez" }'
      spans:
        - name: "livez"
          attributes:
            service.name: basement

    # RFC 9457: problem.Write tags the span with the problem type and status, so
    # a failure is findable in Tempo by cause and not only by status code.
    # The handler runs inside the otelhttp span, so the tag lands on it.
    - traceql: '{ span.problem.type = "https://problems.valri11.dev/validation-error" && span.problem.status = 400 }'
      spans:
        - name: "demo-validation"
          attributes:
            service.name: basement

    # A recovered panic must still mark the trace as failed. problem.Recoverer
    # sits outside the per-route otelhttp handler, so the tag lands on the
    # "request" span started by telemetry.WithRequestLog.
    - traceql: '{ status = error && span.problem.type = "https://problems.valri11.dev/panic" && span.problem.status = 500 }'
      spans:
        - name: "request"
          attributes:
            service.name: basement

    # The catch-all 404 handler is chained but not otelhttp-wrapped, so it also
    # reports on the "request" span, with no specific type.
    - traceql: '{ span.problem.type = "about:blank" && span.problem.status = 404 }'
      spans:
        - name: "request"
          attributes:
            service.name: basement

  metrics:
    - promql: 'req_cnt_total{service_name="basement"}'
      value: "> 0"

    # err_cnt is broken down by problem type, so each error cause is countable
    # on its own rather than lumped into a status-code bucket.
    - promql: 'err_cnt_total{service_name="basement",problem_type="https://problems.valri11.dev/validation-error",status="400"}'
      value: "> 0"

    - promql: 'err_cnt_total{service_name="basement",problem_type="https://problems.valri11.dev/panic",status="500"}'
      value: "> 0"

    - promql: 'err_cnt_total{service_name="basement",problem_type="about:blank",status="404"}'
      value: "> 0"
