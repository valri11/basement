replicaCount: 1

image:
  repository: datavault2.home.lab:15300/val/basement
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  port: 8080
  path: /livez

ingress:
  enabled: false
  host: basement.home.lab

otel:
  serviceName: "basement"
  # Defaults to the node-local collector: http://$(NODE_IP):4317
  endpoint: ""
  environment: ""

config:
  server:
    port: 8080
    disableTLS: true
    disableTelemetry: false
    logLevel: info
