name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure registry auth
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' '${{ gitea.actor }}' '${{ secrets.REGISTRY_TOKEN }}' | base64 -w0)
          echo "{\"auths\":{\"datavault2.home.lab:15300\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json

      - name: Build and push
        run: |
          IMAGE=datavault2.home.lab:15300/${{ gitea.repository }}
          docker build --network host -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
