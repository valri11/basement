name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  live-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Weaver registry check, generated files and live-check
        run: go run github.com/go-task/task/v3/cmd/task@v3.53.1 semconv:check semconv:verify live-check

  push:
    needs: [test, live-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo
        run: apt-get update && apt-get install -y skopeo

      - name: Set up buildx
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' '${{ gitea.actor }}' '${{ secrets.REGISTRY_TOKEN }}' | base64 -w0)
          echo "{\"auths\":{\"datavault2.home.lab:15300\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."datavault2.home.lab:15300"]
            http = true
          EOF
          docker buildx rm ci >/dev/null 2>&1 || true
          docker buildx create --name ci --driver docker-container \
            --driver-opt network=host --buildkitd-config /tmp/buildkitd.toml --use \
            || { docker buildx rm ci >/dev/null 2>&1 || true; \
                 docker buildx create --name ci --driver docker-container \
                   --driver-opt network=host --config /tmp/buildkitd.toml --use; }

      - name: Build image
        run: |
          IMAGE=datavault2.home.lab:15300/${{ gitea.repository }}
          docker buildx build --builder ci --load --pull \
            --cache-from type=registry,ref=$IMAGE:buildcache \
            --cache-to type=registry,ref=$IMAGE:buildcache,mode=max,ignore-error=true \
            --build-arg VERSION=${{ github.sha }} \
            -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Push to Gitea registry
        run: |
          IMAGE=datavault2.home.lab:15300/${{ gitea.repository }}
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' '${{ gitea.actor }}' '${{ secrets.REGISTRY_TOKEN }}' | base64 -w0)
          echo "{\"auths\":{\"datavault2.home.lab:15300\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json
          skopeo copy --dest-tls-verify=false \
            docker-daemon:$IMAGE:latest \
            docker://$IMAGE:latest
          skopeo copy --dest-tls-verify=false \
            docker-daemon:$IMAGE:${{ github.sha }} \
            docker://$IMAGE:${{ github.sha }}
